<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060C1E" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <title>stu. música — Produção musical, arranjo e trilhas sonoras</title>
    <meta name="description" content="Produção musical, arranjo, trilhas sonoras e audiobooks para artistas, bandas e compositores. Do primeiro acorde à faixa finalizada." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="stu. música" />
    <meta property="og:title" content="stu. música — Do primeiro acorde à faixa finalizada." />
    <meta property="og:description" content="Produção musical, arranjo e trilhas sonoras para artistas, bandas e compositores." />
    <meta property="og:url" content="https://musica.produtorastu.com" />
    <meta property="og:image" content="https://musica.produtorastu.com/favicon.png" />
    <meta property="og:locale" content="pt_BR" />

    <!-- ─── Abertura ──────────────────────────────────────────────────────────
         Versão musical da abertura do produtorastu.com (mesma estrutura: fica
         aqui, fora do bundle, para aparecer antes do JavaScript da aplicação).
         O que muda: a logo é a "stu" com nota (o ponto é a cabeça, com haste),
         a batida é 120 bpm em compasso 4/4, a onda vira as barras do hero do
         site, e a saída cai sempre numa batida, com ondas sonoras saindo da nota.
         O Hero da Home espera a classe stu-loading sair para começar a entrada
         (hooks/useAberturaSaindo.js).
         ─────────────────────────────────────────────────────────────────────── -->
    <style>
      #stu-loader {
        --stu-navy: #060c1e;
        --stu-bone: #e8e3dc;
        --stu-orange: #cf5e2c;
      }
      html.stu-loading { overflow: hidden; }
      @media print {
        #stu-loader { display: none !important; }
        html.stu-loading { overflow: visible !important; }
      }

      #stu-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--stu-navy);
      }
      #stu-loader[hidden] { display: none; }

      .stu-stage {
        position: relative;
        display: grid;
        justify-items: center;
        gap: clamp(18px, 4vw, 34px);
      }

      /* Logo: abertura-nota.png, proporção 2002 × 744 */
      .stu-loader-logo {
        position: relative;
        width: clamp(160px, 34vw, 330px);
        aspect-ratio: 2002 / 744;
      }

      /* Cada letra é uma "janela" com overflow hidden (reveal por máscara) */
      .stu-l {
        position: absolute;
        top: 0;
        bottom: 0;
        overflow: hidden;
      }
      .stu-l img {
        position: absolute;
        top: 0;
        height: 100%;
        max-width: none;
        transform: translateY(105%);
        will-change: transform;
      }
      .stu-l--s { left: 0;      width: 28.02%; }
      .stu-l--s img { left: 0;         width: 356.89%; }
      .stu-l--t { left: 28.02%; width: 25.83%; }
      .stu-l--t img { left: -108.48%;  width: 387.15%; }
      .stu-l--u { left: 53.85%; width: 34.2%; }
      .stu-l--u img { left: -157.46%;  width: 292.4%; }

      /* Haste da nota (x 1936–1999, do topo em y 153 até o centro do ponto):
         a janela termina no centro do ponto, então a haste nasce de dentro dele */
      .stu-l--h { left: 96.7%; width: 3.2%; top: 20.56%; bottom: 13.37%; }
      .stu-l--h img { left: -3025%; width: 3128.13%; top: -31.12%; height: 151.35%; }

      /* O ponto laranja (cabeça da nota): desenhado em CSS, na mesma posição da logo */
      .stu-dot {
        position: absolute;
        left: 95.1%;
        top: 86.63%;
        width: 9.79%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--stu-orange);
        transform: translate(-50%, -50%) scale(0);
        will-change: transform;
      }

      /* Camada ambiente: brilho que respira atrás do ponto */
      .stu-glow {
        position: absolute;
        left: 95.1%;
        top: 86.63%;
        width: 70%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(207, 94, 44, .22) 0%, rgba(207, 94, 44, 0) 65%);
        transform: translate(-50%, -50%);
        opacity: 0;
        pointer-events: none;
      }

      /* Barras no estilo da onda do hero do site */
      .stu-eq {
        display: block;
        width: clamp(200px, 46vw, 440px);
        height: clamp(56px, 10vw, 88px);
      }

      /* Ondas sonoras que saem da nota na revelação */
      .stu-eco {
        position: absolute;
        width: 0;
        height: 0;
        border: 1.5px solid var(--stu-orange);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        pointer-events: none;
      }

      .stu-sr {
        position: absolute;
        width: 1px; height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
    <noscript><style>#stu-loader { display: none !important; } html.stu-loading { overflow: auto; }</style></noscript>
  </head>
  <body>
    <div id="stu-loader" role="status" aria-live="polite">
      <span class="stu-sr">Carregando</span>
      <div class="stu-stage" aria-hidden="true">
        <div class="stu-loader-logo">
          <div class="stu-glow"></div>
          <span class="stu-l stu-l--s"><img src="/abertura-nota.png" alt=""></span>
          <span class="stu-l stu-l--t"><img src="/abertura-nota.png" alt=""></span>
          <span class="stu-l stu-l--u"><img src="/abertura-nota.png" alt=""></span>
          <span class="stu-l stu-l--h"><img src="/abertura-nota.png" alt=""></span>
          <div class="stu-dot"></div>
        </div>
        <canvas class="stu-eq"></canvas>
      </div>
      <div class="stu-eco" aria-hidden="true"></div>
      <div class="stu-eco" aria-hidden="true"></div>
    </div>
    <script>
    (function () {
      var root = document.getElementById('stu-loader');
      if (!root) return;

      var MIN_SHOW = 2400;          // tempo mínimo na tela (ms), para a entrada não ser cortada
      var MAX_ESPERA = 7000;        // teto: a abertura sai mesmo se a página não terminar de carregar

      document.documentElement.classList.add('stu-loading');

      // Resgate: falha aqui dentro não pode deixar a página presa atrás de uma
      // tela que não rola (a abertura aplica overflow:hidden no html).
      function resgate() {
        try {
          document.documentElement.classList.remove('stu-loading');
          if (root) root.hidden = true;
        } catch (e) { /* nada mais a fazer */ }
      }
      window.addEventListener('error', resgate);

      var BEAT = 500;               // 120 bpm
      var BEAT_INICIO = 1000;       // a batida começa no 3º tempo da entrada
      var ABRE = 380;               // da saída até o ponto abrir (cai numa batida)
      var reduced = !window.STU_FORCE_MOTION && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var logo = root.querySelector('.stu-loader-logo');
      var dot = root.querySelector('.stu-dot');
      var glow = root.querySelector('.stu-glow');
      var letters = [].slice.call(root.querySelectorAll('.stu-l:not(.stu-l--h) img'));
      var haste = root.querySelector('.stu-l--h img');
      var ecos = [].slice.call(root.querySelectorAll('.stu-eco'));
      var canvas = root.querySelector('.stu-eq');
      var ctx = canvas.getContext('2d');

      // cubic-bezier(x1, y1, x2, y2) → função de easing
      function bezier(x1, y1, x2, y2) {
        function a(p1, p2) { return 1 - 3 * p2 + 3 * p1; }
        function b(p1, p2) { return 3 * p2 - 6 * p1; }
        function c(p1) { return 3 * p1; }
        function at(t, p1, p2) { return ((a(p1, p2) * t + b(p1, p2)) * t + c(p1)) * t; }
        function slope(t, p1, p2) { return 3 * a(p1, p2) * t * t + 2 * b(p1, p2) * t + c(p1); }
        return function (x) {
          if (x <= 0) return 0;
          if (x >= 1) return 1;
          var t = x;
          for (var i = 0; i < 8; i++) {
            var s = slope(t, x1, x2);
            if (Math.abs(s) < 1e-6) break;
            t -= (at(t, x1, x2) - x) / s;
          }
          return at(t, y1, y2);
        };
      }
      var easePop = bezier(0.175, 0.885, 0.32, 1.275);   // pop com overshoot (entrada do ponto)
      var easeInOut = bezier(0.4, 0, 0.2, 1);            // assinatura da marca
      var easeOpen = bezier(0.7, 0, 0.15, 1);            // abertura do ponto (revelação)
      var easeOut = bezier(0.16, 1, 0.3, 1);             // ondas sonoras
      function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      var state, raf;

      function resizeCanvas() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var r = canvas.getBoundingClientRect();
        canvas.width = Math.round(r.width * dpr);
        canvas.height = Math.round(r.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // Batida em 4/4: ataque rápido, decaimento suave, o 1º tempo mais forte
      function beatPulse(t) {
        var compasso = Math.floor(t / BEAT) % 4;
        var ph = (t % BEAT) / BEAT;
        var v = ph < 0.07 ? ph / 0.07 : Math.exp(-(ph - 0.07) * 6);
        return v * (compasso === 0 ? 1 : 0.6);
      }

      // Altura de cada barra (0..1): mais alta no centro, variando com o tempo
      var N_BARRAS = 29;
      function nivel(i, s) {
        var u = i / (N_BARRAS - 1);
        var env = Math.pow(Math.sin(Math.PI * (0.06 + 0.88 * u)), 1.3);
        var r = Math.abs(0.6 * Math.sin(s * 2.1 + i * 1.7) + 0.4 * Math.sin(s * 3.3 + i * 0.9));
        return env * (0.22 + 0.78 * r);
      }

      function drawEq(t, energy, reveal, alpha) {
        var r = canvas.getBoundingClientRect();
        var w = r.width, h = r.height;
        ctx.clearRect(0, 0, w, h);
        if (alpha <= 0 || reveal <= 0) return;
        var gap = 3;
        var bw = (w - gap * (N_BARRAS - 1)) / N_BARRAS;
        var grad = ctx.createLinearGradient(0, h, 0, 0);
        grad.addColorStop(0, 'rgba(207,94,44,' + (0.95 * alpha) + ')');
        grad.addColorStop(1, 'rgba(207,94,44,' + (0.12 * alpha) + ')');
        ctx.fillStyle = grad;
        var half = reveal / 2;
        for (var i = 0; i < N_BARRAS; i++) {
          var u = (i + 0.5) / N_BARRAS;
          if (Math.abs(u - 0.5) > half) continue;
          var bh = Math.max(2, h * energy * nivel(i, t / 1000));
          ctx.fillRect(i * (bw + gap), h - bh, bw, bh);
        }
      }

      function frame(now) {
        var s = state;
        var t = now - s.t0;
        var dotScale = 0, energy = 0, reveal = 0, alpha = 1;

        // 1. Ponto surge: a cabeça da nota (a "batida" inicial)
        dotScale = easePop(clamp01(t / 480));

        // 2. Batida contínua depois da entrada
        var pulse = t > BEAT_INICIO ? beatPulse(t - BEAT_INICIO) : 0;
        if (t > BEAT_INICIO) dotScale = 1 + 0.1 * pulse;

        // 3. Barras: nascem do centro para as bordas, depois dançam com a batida
        reveal = easeInOut(clamp01((t - 650) / 700));
        energy = lerp(0.25, 1, easeInOut(clamp01((t - 650) / 900))) * (0.55 + 0.45 * pulse);

        // 4. Saída
        if (s.exitAt) {
          var e = now - s.exitAt;
          var fade = easeInOut(clamp01(e / 280));
          energy *= 1 - fade;          // as barras caem
          alpha = 1 - easeInOut(clamp01(e / 320));
          dotScale = lerp(dotScale, 1, clamp01(e / 200));

          // antecipação: a haste já recolheu; o ponto se contrai antes de abrir
          var ant = easeInOut(clamp01((e - 200) / 180));
          dotScale *= lerp(1, 0.82, ant);

          // ondas sonoras saem da nota um pouco à frente da abertura
          ecos.forEach(function (el, k) {
            var q = clamp01((e - ABRE - k * 120) / 760);
            if (q <= 0) { el.style.opacity = 0; return; }
            var raio = lerp(s.dotR, s.maxR * 0.92, easeOut(q));
            el.style.width = el.style.height = (raio * 2) + 'px';
            el.style.opacity = (0.8 - 0.3 * k) * (1 - q);
          });

          // abertura: o ponto vira um anel que se expande e revela o site
          var p = easeOpen(clamp01((e - ABRE) / 900));
          if (e > ABRE) {
            var baseR = s.dotR;
            var outer = lerp(baseR * 0.82, s.maxR + 24, p);
            var rim = baseR * 0.82 * Math.pow(1 - p, 1.3);
            var hole = Math.max(0, outer - rim);
            // muda o tamanho real (não o scale) para a borda do anel ficar nítida
            dot.style.width = (outer * 2) + 'px';
            dotScale = 1;
            var mask = 'radial-gradient(circle at ' + s.cx + 'px ' + s.cy + 'px, transparent ' + hole + 'px, #000 ' + (hole + 0.5) + 'px)';
            root.style.webkitMaskImage = mask;
            root.style.maskImage = mask;
            if (p >= 1) { finish(); return; }
          }
        }

        dot.style.transform = 'translate(-50%, -50%) scale(' + dotScale + ')';
        drawEq(t, energy, reveal, alpha);
        raf = requestAnimationFrame(frame);
      }

      function animateIn() {
        // a haste sobe de dentro do ponto: a nota se forma
        haste.animate(
          [{ transform: 'translateY(105%)' }, { transform: 'translateY(0)' }],
          { duration: 560, delay: 260, easing: 'cubic-bezier(0.05, 0.7, 0.1, 1)', fill: 'both' }
        );
        letters.forEach(function (img, i) {
          img.animate(
            [{ transform: 'translateY(105%)' }, { transform: 'translateY(0)' }],
            { duration: 720, delay: 520 + i * 90, easing: 'cubic-bezier(0.05, 0.7, 0.1, 1)', fill: 'both' }
          );
        });
        glow.animate(
          [{ opacity: 0, transform: 'translate(-50%,-50%) scale(.6)' }, { opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }],
          { duration: 900, delay: 200, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'both' }
        );
      }

      function breatheGlow() {
        state.breath = glow.animate(
          [{ opacity: 1 }, { opacity: 0.55 }, { opacity: 1 }],
          { duration: BEAT * 8, iterations: Infinity, easing: 'ease-in-out' }
        );
      }

      function exit() {
        var r = logo.getBoundingClientRect();
        state.cx = r.left + r.width * 0.951;
        state.cy = r.top + r.height * 0.8663;
        state.dotR = r.width * 0.0979 / 2;
        state.maxR = Math.hypot(Math.max(state.cx, innerWidth - state.cx), Math.max(state.cy, innerHeight - state.cy));
        state.exitAt = performance.now();
        document.documentElement.classList.remove('stu-loading');

        ecos.forEach(function (el) {
          el.style.left = state.cx + 'px';
          el.style.top = state.cy + 'px';
        });
        // a haste recolhe para dentro do ponto
        haste.animate(
          [{ transform: 'translateY(0)' }, { transform: 'translateY(105%)' }],
          { duration: 240, delay: 40, easing: 'cubic-bezier(0.5, 0, 0.75, 0)', fill: 'both' }
        );
        letters.forEach(function (img, i) {
          img.animate(
            [{ transform: 'translateY(0)' }, { transform: 'translateY(-105%)' }],
            { duration: 340, delay: i * 50, easing: 'cubic-bezier(0.3, 0, 1, 1)', fill: 'both' }
          );
        });
        if (state.breath) state.breath.cancel();
        glow.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, easing: 'ease-in', fill: 'both' });
      }

      // A saída espera a próxima batida: o ponto abre sempre no tempo
      function exitNoTempo() {
        var t = performance.now() - state.t0;
        var k = Math.ceil((t + ABRE - BEAT_INICIO) / BEAT);
        var alvo = BEAT_INICIO + k * BEAT - ABRE;
        setTimeout(exit, Math.max(0, alvo - t));
      }

      function finish() {
        cancelAnimationFrame(raf);
        root.hidden = true;
        root.style.webkitMaskImage = root.style.maskImage = '';
        ecos.forEach(function (el) { el.style.opacity = 0; });
        state.done();
      }

      // Versão para quem pediu menos movimento: aparece e some com fade simples
      function playReduced(ready) {
        root.hidden = false;
        letters.concat(haste).forEach(function (img) { img.style.transform = 'none'; });
        dot.style.transform = 'translate(-50%, -50%) scale(1)';
        canvas.style.display = 'none';
        return ready.then(function () {
          document.documentElement.classList.remove('stu-loading');
          return root.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'both' }).finished;
        }).then(function () { root.hidden = true; });
      }

      function play(ready) {
        if (reduced) return playReduced(ready);
        cancelAnimationFrame(raf);
        root.hidden = false;
        root.style.webkitMaskImage = root.style.maskImage = '';
        dot.style.width = '';
        document.documentElement.classList.add('stu-loading');
        letters.concat(haste, glow).forEach(function (el) { el.getAnimations().forEach(function (a) { a.cancel(); }); });
        resizeCanvas();

        return new Promise(function (done) {
          state = { t0: performance.now(), done: done };
          animateIn();
          setTimeout(breatheGlow, 1100);
          raf = requestAnimationFrame(frame);
          Promise.all([ready, wait(MIN_SHOW)]).then(exitNoTempo);
        });
      }

      // O evento load só dispara quando TUDO termina, inclusive o vídeo de
      // fundo. Sem o teto, uma conexão ruim prenderia o visitante.
      var pageLoaded = Promise.race([
        new Promise(function (r) {
          if (document.readyState === 'complete') r();
          else window.addEventListener('load', r, { once: true });
        }),
        wait(MAX_ESPERA),
      ]);

      window.addEventListener('resize', function () { if (!root.hidden) resizeCanvas(); });

      play(pageLoaded).catch(resgate);

      // API opcional: window.stuLoader.replay()
      window.stuLoader = {
        replay: function () { return play(Promise.resolve()); }
      };
    })();
    </script>

    <!-- Camada do vídeo de fundo (o VideoBackground renderiza aqui por portal).
         Precisa ser filho direto do body e vir antes do #root — ver global.css. -->
    <div id="stu-fundo" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
